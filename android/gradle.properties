# Keep heap conservative for on-device builds (reduce if OOM on low-RAM devices)
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Disable daemon — Android OS may kill long-lived background processes mid-build
org.gradle.daemon=false

# No AndroidX — zero external dependencies keeps this fully self-contained
android.useAndroidX=false

# IMPORTANT (Termux/ARM64): Gradle downloads an x86-64 aapt2 from Maven that
# cannot run on ARM64. setup-termux.sh writes the override below into
# ~/.gradle/gradle.properties so it applies globally without polluting this file.
# If you need to set it manually, add to ~/.gradle/gradle.properties:
#   android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
